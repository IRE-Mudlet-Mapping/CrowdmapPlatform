name: Auto-merge Dependabot update

on:
  workflow_call:

jobs:
  enable-auto-merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Find eligible Dependabot pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number="$(gh api "/repos/$REPOSITORY/commits/$HEAD_SHA/pulls" --jq '.[0].number // empty')"
          if test -z "$number"; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pull_request="$(gh api "/repos/$REPOSITORY/pulls/$number" --jq '[.user.login, .base.ref] | @tsv')"
          if test "$pull_request" = $'dependabot[bot]\tdevelopment'; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "number=$number" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare Dependabot metadata context
        if: steps.pull-request.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
        run: |
          # fetch-metadata expects a PR payload; workflow_run does not provide one.
          gh api "/repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '{pull_request: .}' > "$RUNNER_TEMP/crowdmap-dependabot-event.json"
      - name: Fetch verified Dependabot metadata
        if: steps.pull-request.outputs.eligible == 'true'
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        env:
          GITHUB_EVENT_PATH: ${{ runner.temp }}/crowdmap-dependabot-event.json
        with:
          github-token: ${{ github.token }}
      - name: Select compatible update types
        if: steps.pull-request.outputs.eligible == 'true'
        id: update-policy
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              echo "compatible=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "compatible=false" >> "$GITHUB_OUTPUT"
              echo "Update type '$UPDATE_TYPE' requires manual review." ;;
          esac
      - name: Approve validated dependency update
        if: steps.pull-request.outputs.eligible == 'true' && steps.update-policy.outputs.compatible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: https://github.com/${{ github.repository }}/pull/${{ steps.pull-request.outputs.number }}
        run: gh pr review --approve "$PR_URL"
      - name: Enable squash auto-merge
        if: steps.pull-request.outputs.eligible == 'true' && steps.update-policy.outputs.compatible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: https://github.com/${{ github.repository }}/pull/${{ steps.pull-request.outputs.number }}
        run: gh pr merge --auto --squash "$PR_URL"
