name: Validate map pull request

on:
  workflow_call:

jobs:
  danger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Fetch pull request map for validation
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-head
          git checkout pr-head -- Map/map || true
      - uses: actions/checkout@v7
        with:
          repository: IRE-Mudlet-Mapping/CrowdmapPlatform
          ref: v1
          path: .crowdmap-platform
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .crowdmap-platform/package-lock.json
      - run: npm ci --prefix .crowdmap-platform
      - name: Install optional game-owned Danger dependencies
        run: node .crowdmap-platform/scripts/prepare-plugins.mjs crowdmap.json danger "$GITHUB_WORKSPACE"
      - name: Run the shared checks from the game root
        run: |
          cp -R .crowdmap-platform/danger .crowdmap-danger
          ln -s "$GITHUB_WORKSPACE/.crowdmap-platform/node_modules" "$GITHUB_WORKSPACE/.crowdmap-danger/node_modules"
          node .crowdmap-platform/scripts/generate-danger-extensions.mjs crowdmap.json .crowdmap-danger/extensions.ts "$GITHUB_WORKSPACE"
          ./.crowdmap-platform/node_modules/.bin/danger ci -d .crowdmap-danger/dangerfile.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
