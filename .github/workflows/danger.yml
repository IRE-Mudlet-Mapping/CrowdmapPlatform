name: Validate map pull request

on:
  workflow_call:

jobs:
  danger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Fetch pull request map for validation
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-head
          git checkout pr-head -- Map/map || true
      - uses: actions/checkout@v7
        with:
          repository: IRE-Mudlet-Mapping/CrowdmapPlatform
          ref: v1
          path: .crowdmap-platform
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: .crowdmap-platform/yarn.lock
      - run: yarn --cwd .crowdmap-platform install --frozen-lockfile
      - run: yarn --cwd .crowdmap-platform danger ci -d danger/dangerfile.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
