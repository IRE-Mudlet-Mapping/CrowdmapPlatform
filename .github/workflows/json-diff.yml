name: JSON map diff

on:
  workflow_call:

jobs:
  json-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout base map
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: old
      - name: Checkout pull request map
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: current
      - name: Fetch pull request map
        working-directory: current
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-head
          git checkout pr-head
      - name: Checkout platform
        uses: actions/checkout@v7
        with:
          repository: IRE-Mudlet-Mapping/CrowdmapPlatform
          ref: v1
          path: .crowdmap-platform
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .crowdmap-platform/package-lock.json
      - run: sudo apt-get update && sudo apt-get install --yes jq diffutils
      - run: npm ci --prefix .crowdmap-platform
      - name: Generate exports and comment
        run: |
          node .crowdmap-platform/scripts/generate-map.mjs old
          node .crowdmap-platform/scripts/generate-map.mjs current
          {
            echo '## Textual map diff'
            echo '<details>'
            echo '<summary>Open to see the map diff</summary>'
            echo
            echo '```diff'
            .crowdmap-platform/scripts/create-diff.sh old/Map/map.json current/Map/map.json || true
            echo '```'
            echo '</details>'
          } > output.txt
      - uses: peter-evans/find-comment@v4
        id: comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: Textual map diff
      - uses: actions/github-script@v9
        with:
          script: |
            const body = require('fs').readFileSync('output.txt', 'utf8');
            const commentId = '${{ steps.comment.outputs.comment-id }}';
            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: commentId, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
