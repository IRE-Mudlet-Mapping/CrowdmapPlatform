name: Release Please

on:
  push:
    branches: [development]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node
          target-branch: development
      - name: Checkout the release commit
        if: steps.release.outputs.release_created
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Advance the v1 compatibility tag
        if: steps.release.outputs.release_created && steps.release.outputs.major == '1'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --tags --force
          git tag --force --annotate v1 "${RELEASE_TAG}^{}" --message "Crowdmap Platform v1 compatibility line"
          git push origin refs/tags/v1 --force
