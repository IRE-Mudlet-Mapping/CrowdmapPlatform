name: Conventional commits

on:
  # Run from the trusted base branch so bot and fork PRs do not wait for
  # repository workflow approval. Never execute code from the PR in this job.
  pull_request_target:
    branches: [development]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([\w./-]+\))?!?: .+$/;
            if (!pattern.test(title)) {
              core.setFailed(`PR title must be a Conventional Commit: ${title}`);
            }
  validate-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted commit-lint tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch pull request commits without checking them out
        run: git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/pr-head"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate every pull request commit
        run: |
          npx commitlint \
            --config commitlint.config.cjs \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to refs/remotes/origin/pr-head
