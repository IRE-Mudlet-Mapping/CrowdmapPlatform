name: Platform CI

on:
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Verify update policy against a real Dependabot PR (read-only)
        run: node --test scripts/dependabot-auto-merge.test.mjs
        env:
          CROWDMAP_VERIFY_LIVE_DEPENDABOT: "true"
          GITHUB_TOKEN: ${{ github.token }}
